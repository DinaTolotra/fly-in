[project]
name = "fly-in"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DinaTolotra", email = "ratsinjomananatolotra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.1.2",
    "mypy>=1.15.0",
]

[project.scripts]
fly-in = "fly_in:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
